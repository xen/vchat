{% extends "base.html" %}

{% block fullbody %}
<main class="bg-base-200 min-h-screen">
  <div class="flex min-h-screen items-center justify-center px-4">
    <div class="flex flex-col items-center gap-4 rounded-2xl border border-base-200 bg-base-100 px-8 py-10 text-center shadow-xl">
      <span class="loading loading-ring loading-lg text-primary"></span>
      <div>
        <p class="text-lg font-semibold">{{ _('Signing you in') }}...</p>
        <p class="text-base-content/70 text-sm">
          {{ _('Please wait while we prepare your workspace.') }}
        </p>
      </div>
    </div>
  </div>
</main>

<script>
  localStorage.removeItem("token");
  localStorage.removeItem("role");
  localStorage.removeItem("refresh_token");
  localStorage.removeItem("scope");
  localStorage.setItem("token", "{{ token }}");
  localStorage.setItem("role", "{{ role }}");
  localStorage.setItem("refresh_token", "{{ refresh }}");
  localStorage.setItem("scope", "{{ scope }}");
  window.location.href = "{{ url }}";
</script>
{% endblock %}
