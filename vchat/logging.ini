[loggers]
keys = root,aiohttp_access,aiohttp_server

[handlers]
keys = console

[formatters]
keys = plain,json

[logger_root]
level = INFO
handlers = console
qualname =

[logger_aiohttp_access]
level = INFO
handlers =
qualname = aiohttp.access
propagate = 1

[logger_aiohttp_server]
level = INFO
handlers =
qualname = aiohttp.server
propagate = 1

[handler_console]
class = StreamHandler
level = NOTSET
formatter = plain
args = (sys.stderr,)

[formatter_plain]
class = vchat.logging.PlainLogFormatter
datefmt = %Y-%m-%d %H:%M:%S

[formatter_json]
class = vchat.logging.JsonLogFormatter
