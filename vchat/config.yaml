mode: production
crawler_user_agent: "Dzen-AI/1.0"

# Application settings
max_upload_size: 5242880 # 5 MB
raw_content_max_bytes: 10485760 # 10 MB
enable_https_middleware: true # Enable HTTPS middleware on production
cookie_name: USER
# Should be overridden in local.yaml at production
cookie_domain: ".vchat.com"
# Should be set to true at production
cookie_secure: true

# Storages
redis_uri: redis://localhost:6379/30
database_uri: postgresql+asyncpg://xen@localhost:5432/vchat
api_update_timestamp_ttl_seconds: 60
api_update_nonce_ttl_seconds: 180
api_update_rate_limit_window_seconds: 60
api_update_rate_limit_requests: 60
widget_page_discovery_enabled: false

celery_redis_uri: redis://localhost:6379/
celery_broker_db: 31
celery_backend_db: 32
celery_max_retries: 3
celery_retry_delay: 5
celery_default_queue: celery
celery_visibility_timeout: 21600 # seconds; keep long-running embedder jobs from being redelivered
celery_worker_concurrency: 4
celery_worker_max_tasks_per_child: 100
celery_worker_max_memory_per_child_kb: 524288

# Debugging settings
loglevel: info
log_format: text
log_config: vchat/logging.ini
sql_echo: false

time_zone: Europe/Moscow

public_url: "https://www.vchat.com"
public_cdn: "https://www.vchat.com" # for near future
allowed_origins:
  - "https://www.vchat.com"
  - "https://vchat.com"
  - "https://local.vchat.com"
media_prefix: "/media"
media_root: "media"
post_per_page: 10

# OpenAI Configuration
chat_provider: "openai"
chat_model: "gpt-4o-mini"
openai_api_key: ""
openai_model: "gpt-4o-mini"
openai_base_url: "https://api.openai.com/v1"
yandex_base_url: ""
gigachat_base_url: "https://gigachat.devices.sberbank.ru/api/v1"
gigachat_oauth_url: "https://ngw.devices.sberbank.ru:9443/api/v2/oauth"
gigachat_scope: "GIGACHAT_API_PERS"
gigachat_verify_ssl_certs: true
openai_guardrails_enabled: true
guardrails_ru_pii_enabled: true
embedding_model_id: "deepvk/USER-bge-m3"
embedding_model_dir: "data/models/user-bge-m3"
reranker_model_id: "BAAI/bge-reranker-v2-m3"
# Embedding / pgvector dimension for stored vectors and similarity queries.
vec_dim: 1024
embedding_max_seq_length: 8192
embedding_chunk_max_tokens: 3500
embedding_chunk_overlap_tokens: 400
embedding_chunk_max_chars: 12000
embedding_encode_batch_max_chars: 12000
embedding_document_max_chars: 100000
embedding_pending_chunks_batch_size: 8
embedding_pending_chunks_max_inflight: 32
embedding_pending_chunks_counter_ttl_seconds: 600
embedding_ensure_pending_chunks_ttl_seconds: 120
embedding_index_document_schedule_ttl_seconds: 21600
page_shingle_insert_batch_size: 2000
embedding_model_reset_after_documents: 20
embedding_worker_instances: auto
embedding_worker_cpu_reserve: 1
yandex_api_key: ""
# Base64-ключ из кабинета GigaChat для заголовка Authorization: Basic <key>
gigachat_api_key: ""

# Authentication methods: at least one must be enabled
auth_basic_enabled: true
auth_ldap_enabled: false
ldap_server: "ldap://ldap.example.com:389"
ldap_use_ssl: false
ldap_bind_dn: ""
ldap_bind_password: ""
ldap_search_base: ""
ldap_search_filter: "(mail={email})"
ldap_attr_name: "displayName"

