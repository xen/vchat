<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>{% block title %}{%if page_title %}{{ page_title }}{%else%}{{ meta.title }}{%endif%}{% endblock %} — vchat</title>
  {% block meta -%}
    {% if meta.description %}<meta name="description" content="{{ meta.description }}">{% endif %}
    {% if meta.author %}<meta name="author" content="{{ meta.author }}">{% endif %}
  {% endblock -%}
  <link rel="apple-touch-icon" sizes="180x180" href="/static/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon/favicon-16x16.png">
  <link rel="icon" type="image/png" href="/static/favicon.ico">
  <link href="/static/assets/app.css?v={{ static_version }}" rel="stylesheet" type="text/css">

  {% block extramedia %}{% endblock %}
  <script>
    try {
      const config = JSON.parse(localStorage.getItem("CONF"));
      if (config && config.theme && config.theme !== "system") {
        document.documentElement.setAttribute("data-theme", config.theme);
      }
    } catch (e) {}
  </script>

</head>
<body {% block body_id %}{% endblock %}>
<div class="h-screen w-full overflow-hidden">
  {% block content %}{% endblock %}
  <div class="fixed inset-x-0 bottom-6 text-center">
    <a href="/" class="text-sm font-medium text-sky-700 underline underline-offset-4 hover:text-sky-900 dark:text-sky-300 dark:hover:text-sky-200">
      {{ _("Назад на главную") }}
    </a>
  </div>
</div>

{% block extra_bottom %}{% endblock %}
</body>
</html>
