<div class="chat-footer opacity-50 flex gap-2 items-center mt-1" id="vote-area-{{ msg_id }}">
     <button class="btn btn-ghost btn-xs btn-square {{ 'text-primary' if vote is sameas true else '' }}"
             aria-label="Ответ полезен"
             data-vote-url="/actions/chat/vote/{{ msg_id }}?vote={{ 'none' if vote is sameas true else 'up' }}">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M2 10.5a1.5 1.5 0 113 0v6a1.5 1.5 0 01-3 0v-6zM6 10.333v5.43a2 2 0 001.106 1.79l.05.025A4 4 0 008.943 18h5.416a2 2 0 001.962-1.608l1.2-6A2 2 0 0015.56 8H12V4a2 2 0 00-2-2 1 1 0 00-1 1v.667a4 4 0 01-.8 2.4L6.8 7.933a4 4 0 00-.8 2.4z" /></svg>
     </button>

     <button class="btn btn-ghost btn-xs btn-square {{ 'text-primary' if vote is sameas false else '' }}"
             aria-label="Ответ не полезен"
             data-vote-url="/actions/chat/vote/{{ msg_id }}?vote={{ 'none' if vote is sameas false else 'down' }}">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M18 9.5a1.5 1.5 0 11-3 0v-6a1.5 1.5 0 013 0v6zM14 9.667v-5.43a2 2 0 00-1.105-1.79l-.05-.025A4 4 0 0011.055 2H5.64a2 2 0 00-1.962 1.608l-1.2 6A2 2 0 004.44 12H8v4a2 2 0 002 2 1 1 0 001-1v-.667a4 4 0 01.8-2.4l1.4-1.866a4 4 0 00.8-2.4z" /></svg>
     </button>
</div>
