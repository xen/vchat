<html lang="ru" data-theme="light">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ _('Чат') }} - {{ project.title }}</title>
  <link rel="stylesheet" href="/static/chat/chat.css" />
  <script type="module" src="/static/chat/chat.js"></script>
  <style>
    .chat-bubble.markdown-body {
      max-width: 100%;
      overflow-x: hidden;
    }
  </style>
</head>

<body class="flex flex-col h-[100dvh] bg-base-100 text-base-content antialiased overflow-hidden"
  hx-headers='{"X-CSRFToken": "{{ support_csrf_token if support_csrf_token is defined else csrf_token() }}"}'>

  <!-- Навигация -->
  <header class="flex-none navbar bg-base-100 border-b border-base-200 shadow-sm z-10 min-h-12 px-4 gap-2">
    <div class="flex-1 gap-2 items-center">
      <div class="flex flex-col">
        <span class="font-bold text-sm leading-tight">{{ project.title }}</span>
        <span class="text-xs opacity-60 leading-tight">{{ agent_name if agent_name else _('Виртуальный ассистент') }}</span>
      </div>
    </div>
    <div class="flex-none flex flex-col items-end gap-1 text-xs">
      {% if allow_ai_switch %}
      <span class="font-semibold uppercase tracking-wide opacity-60">{{ _('Модель') }}</span>
      {% include 'chat/includes/ai_settings.html' %}
      {% endif %}
    </div>
    <div class="flex-none"></div>
  </header>

  <!-- Chat Log -->
  <main id="log" class="flex-1 overflow-y-auto w-full p-4 space-y-4 scroll-smooth">
    <!-- Messages will appear here -->
  </main>

  <!-- Footer Input -->
  <div class="flex-none w-full bg-base-100 p-4 border-t border-base-200">
    <form id="composer" class="relative w-full">
      <textarea id="prompt"
        class="textarea textarea-bordered textarea-md w-full pr-12 resize-none bg-base-100 focus:outline-none" rows="2"
        placeholder="{{ _('Введите сообщение…') }}"></textarea>
      <button id="send" type="submit" class="btn btn-soft btn-primary btn-sm absolute bottom-3 right-3"
        aria-label="{{ _('Отправить') }}">
        {{ _('Отправить') }}
      </button>
    </form>
    <div id="status" class="text-xs text-left mt-2 opacity-50">
      <span class="badge badge-xs badge-warning mr-1"></span> {{ _('подключение…') }}
    </div>
  </div>

  <script type="module">
    const statusEl = document.getElementById('status');
    const logEl = document.getElementById('log');
    const formEl = document.getElementById('composer');
    const promptEl = document.getElementById('prompt');
    const sendBtn = document.getElementById('send');
    const aiSettingsUrl = {{ ai_settings_url| tojson | safe }};
    const aiOptions = {{ ai_provider_options| tojson | safe }};
    const allowAiSwitch = {{ allow_ai_switch| tojson }};
    const csrfToken = {{ csrf_token() | tojson | safe }};
    const aiProviderSelect = document.getElementById('chat-provider-select');
    const aiModelSelect = document.getElementById('chat-model-select');
    const aiStatusEl = document.getElementById('ai-settings-status');
    const initialMessages = {{ initial_messages|default([])|tojson|safe }};
    const signedChatId = {{ signed_chat_id|default(None)|tojson|safe }};

    let ws;
    let currentBotBubble = null;

    function wsUrl() {
      const payload = '{{ payload }}';
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      return `${proto}://${location.host}/ws/chat/${payload}`;
    }

    function updateStatus(text, type) {
      let badgeClass = 'badge-warning';
      if (type === 'подключено') badgeClass = 'badge-success';
      if (type === 'error') badgeClass = 'badge-error';

      statusEl.innerHTML = `<span class="badge badge-xs ${badgeClass} mr-1"></span> ${text}`;
    }

    function renderSourcesHtml(sources = [], reasonCode = null) {
      if ((!sources || sources.length === 0) && !reasonCode) {
        return '';
      }
      const sourceCards = (sources || []).map((source) => {
        const citationId = source.citation_id ?? '';
        const title = source.display_path || source.title || '{{ _("Источник") }}';
        const metaParts = [source.kind, source.section_path].filter(Boolean);
        const metaHtml = metaParts.length
          ? `<div class="mt-1 text-[0.7rem] opacity-70">${metaParts.join(' · ')}</div>`
          : '';
        const href = source.uri || '#';
        return `
          <a
            href="${href}"
            target="_blank"
            rel="noopener"
            class="source-item rounded-box border border-base-content/10 bg-base-100/60 px-3 py-2 hover:border-primary/40 transition-colors"
            data-id="${citationId}">
            <div class="font-medium">${title}</div>
            ${metaHtml}
          </a>
        `;
      }).join('');
      const reasonBadge = reasonCode
        ? `<span class="badge badge-outline badge-xs">${reasonCode}</span>`
        : '';
      return `
        <div data-structured-context="true">
          <div class="divider my-2 opacity-40"></div>
          <div class="flex flex-col gap-2 text-xs">
            <div class="flex items-center justify-between gap-2">
              <div class="font-bold opacity-70">{{ _('Источники') }}</div>
              ${reasonBadge}
            </div>
            <div class="grid gap-2">${sourceCards}</div>
          </div>
        </div>
      `;
    }

    function attachStructuredContext(bubble, sources = [], reasonCode = null) {
      if (!bubble) {
        return;
      }
      bubble.querySelectorAll('[data-structured-context="true"]').forEach((node) => node.remove());
      const html = renderSourcesHtml(sources, reasonCode);
      if (!html) {
        return;
      }
      bubble.insertAdjacentHTML('beforeend', html);
    }

    function ensureVoteArea(chatDiv, msgId, signedMsgId, vote = null) {
      if (!chatDiv || !signedMsgId) {
        return;
      }
      const areaId = `vote-area-${msgId}`;
      const existing = chatDiv.querySelector(`#${areaId}`);
      if (existing) {
        existing.remove();
      }
      const footer = document.createElement('div');
      footer.className = 'chat-footer opacity-50 flex gap-2 items-center mt-1';
      footer.id = areaId;
      footer.innerHTML = `
        <button class="btn btn-ghost btn-xs btn-square ${vote === true ? 'text-primary' : ''}"
                aria-label="Upvote"
                hx-post="/actions/chat/vote/${signedMsgId}?vote=${vote === true ? 'none' : 'up'}"
                data-vote-url="/actions/chat/vote/${signedMsgId}?vote=${vote === true ? 'none' : 'up'}"
                hx-swap="outerHTML"
                hx-target="#${areaId}">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path d="M2 10.5a1.5 1.5 0 113 0v6a1.5 1.5 0 01-3 0v-6zM6 10.333v5.43a2 2 0 001.106 1.79l.05.025A4 4 0 008.943 18h5.416a2 2 0 001.962-1.608l1.2-6A2 2 0 0015.56 8H12V4a2 2 0 00-2-2 1 1 0 00-1 1v.667a4 4 0 01-.8 2.4L6.8 7.933a4 4 0 00-.8 2.4z" /></svg>
        </button>
        <button class="btn btn-ghost btn-xs btn-square ${vote === false ? 'text-primary' : ''}"
                aria-label="Downvote"
                hx-post="/actions/chat/vote/${signedMsgId}?vote=${vote === false ? 'none' : 'down'}"
                data-vote-url="/actions/chat/vote/${signedMsgId}?vote=${vote === false ? 'none' : 'down'}"
                hx-swap="outerHTML"
                hx-target="#${areaId}">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path d="M18 9.5a1.5 1.5 0 11-3 0v-6a1.5 1.5 0 013 0v6zM14 9.667v-5.43a2 2 0 00-1.105-1.79l-.05-.025A4 4 0 0011.055 2H5.64a2 2 0 00-1.962 1.608l-1.2 6A2 2 0 004.44 12H8v4a2 2 0 002 2 1 1 0 001-1v-.667a4 4 0 01.8-2.4l1.4-1.866a4 4 0 00.8-2.4z" /></svg>
        </button>
      `;
      chatDiv.appendChild(footer);
      if (window.htmx && typeof window.htmx.process === 'function') {
        window.htmx.process(footer);
      }
    }

    function appendMsg(text, type = 'bot', isPartial = false, msgId = null, signedMsgId = null, vote = null, sources = [], reasonCode = null) {
      if (type === 'bot' && isPartial && currentBotBubble) {
        const rawText = (currentBotBubble.dataset.raw || '') + text;
        currentBotBubble.dataset.raw = rawText;
        currentBotBubble.querySelector('.markdown-body').innerHTML = marked.parse(rawText);
        logEl.scrollTop = logEl.scrollHeight;
        return;
      } else {
        const chatDiv = document.createElement('div');
        chatDiv.className = type === 'bot' ? 'chat chat-start' : 'chat chat-end';

        if (type === 'bot') {
          const header = document.createElement('div');
          header.className = 'chat-header text-xs opacity-50 mb-1';
          header.textContent = '{{ agent_name if agent_name else "Ассистент" }}';
          chatDiv.appendChild(header);
        }

        const bubble = document.createElement('div');
        bubble.className = type === 'bot'
          ? 'chat-bubble chat-bubble-base-200 w-full max-w-sm sm:max-w-md md:max-w-lg'
          : 'chat-bubble chat-bubble-primary text-primary-content';

        if (type === 'bot') {
          bubble.dataset.raw = text;
          bubble.innerHTML = `<div class="markdown-body">${marked.parse(text)}</div>`;
          if (isPartial) {
            currentBotBubble = bubble;
          }
          if (!isPartial) {
            attachStructuredContext(bubble, sources, reasonCode);
          }
          chatDiv.appendChild(bubble);
          if (!isPartial && signedMsgId) {
            ensureVoteArea(chatDiv, msgId, signedMsgId, vote);
          }
        } else {
          if (type === 'error') {
            bubble.className = 'chat-bubble chat-bubble-error text-error-content';
            bubble.textContent = text;
          } else {
            bubble.textContent = text;
          }
          currentBotBubble = null;
          chatDiv.appendChild(bubble);
        }

        logEl.appendChild(chatDiv);
      }
      logEl.scrollTop = logEl.scrollHeight;
    }

    function setSending(sending) {
      sendBtn.disabled = sending;
      promptEl.disabled = sending;
      if (!sending) {
        promptEl.focus();
      }
    }

    async function voteRequest(url, formData = null) {
      const headers = {
        'X-CSRFToken': csrfToken,
      };
      const init = {
        method: 'POST',
        headers,
      };
      if (formData) {
        init.body = formData;
      }
      const resp = await fetch(url, init);
      if (!resp.ok) {
        const text = await resp.text();
        throw new Error(`Vote request failed: ${resp.status} ${text}`);
      }
      return resp.text();
    }

    function replaceVoteArea(currentArea, html) {
      if (!currentArea || !html) return;
      const template = document.createElement('template');
      template.innerHTML = html.trim();
      const nextArea = template.content.firstElementChild;
      if (!nextArea) return;
      currentArea.replaceWith(nextArea);
      if (window.htmx && typeof window.htmx.process === 'function') {
        window.htmx.process(nextArea);
      }
    }

    async function reportSession() {
      if (!signedChatId || typeof window.vchatGetFingerprint !== 'function') {
        return;
      }
      try {
        const payload = await window.vchatGetFingerprint();
        await fetch(`/actions/chat/session/${signedChatId}`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': csrfToken,
          },
          credentials: 'same-origin',
          body: JSON.stringify(payload),
        });
      } catch (error) {
        console.warn('Failed to report chat session metadata', error);
      }
    }

    function connect() {
      ws = new WebSocket(wsUrl());
      ws.onopen = () => {
        updateStatus('{{ _("подключено") }}', 'подключено');
      };
      ws.onclose = () => {
        updateStatus('{{ _("отключено") }}', 'warning');
        setSending(false);
        currentBotBubble = null;
      };
      ws.onerror = () => {
        updateStatus('{{ _("ошибка") }}', 'error');
        setSending(false);
        currentBotBubble = null;
      };
      ws.onmessage = (ev) => {
        let data;
        try {
          data = JSON.parse(ev.data);
        } catch (e) {
          console.error('WS parse error', e, ev.data);
          return;
        }

        try {
          if (data.type === 'suggested_actions') {
            if (data.actions && data.actions.length > 0) {
              const actionsDiv = document.createElement('div');
              actionsDiv.className = 'pl-12 flex flex-wrap gap-2 mb-4'; // Added margin-bottom for spacing
              data.actions.forEach(action => {
                const btn = document.createElement('button');
                btn.className = 'btn btn-xs btn-outline bg-base-100';
                btn.textContent = action;
                btn.onclick = () => {
                  promptEl.value = action;
                  submitMessage();
                  actionsDiv.remove();
                };
                actionsDiv.appendChild(btn);
              });
              logEl.appendChild(actionsDiv);
              logEl.scrollTop = logEl.scrollHeight;
            }
          } else if (data.ok) {
            if (data.partial) {
              if (data.content) {
                appendMsg(data.content, 'bot', true);
              }
            } else if (currentBotBubble) {
              if (data.content) {
                const rawText = (currentBotBubble.dataset.raw || '') + data.content;
                currentBotBubble.dataset.raw = rawText;
                currentBotBubble.querySelector('.markdown-body').innerHTML = marked.parse(rawText);
              }
              attachStructuredContext(currentBotBubble, data.sources || [], data.reason_code || null);
              const chatDiv = currentBotBubble.closest('.chat');
              if (chatDiv && data.signed_msg_id) {
                ensureVoteArea(chatDiv, data.msg_id, data.signed_msg_id);
              }
              setSending(false);
              currentBotBubble = null;
            } else {
              appendMsg(
                data.content || '',
                'bot',
                false,
                data.msg_id,
                data.signed_msg_id,
                null,
                data.sources || [],
                data.reason_code || null,
              );
              setSending(false);
            }
          } else {
            appendMsg(`Ошибка: ${data.error} ${data.status ? '(' + data.status + ')' : ''}\n${typeof data.detail === 'string' ? data.detail : JSON.stringify(data.detail)}`, 'error');
            setSending(false);
          }
        } catch (e) {
          console.error('WS handler error', e, data);
          setSending(false);
        }
      };
    }


    const submitMessage = () => {
      const text = promptEl.value.trim();
      if (!text) return;

      appendMsg(text, 'user');
      setSending(true);

      if (!ws || ws.readyState !== WebSocket.OPEN) {
        connect();
        setTimeout(() => ws && ws.send(text), 100);
      } else {
        ws.send(text);
      }
      promptEl.value = '';
    };

    formEl.addEventListener('submit', (e) => {
      e.preventDefault();
      submitMessage();
    });

    logEl.addEventListener('click', async (e) => {
      const btn = e.target.closest('[data-vote-url]');
      if (!btn) return;
      e.preventDefault();
      const url = btn.getAttribute('data-vote-url');
      const voteArea = btn.closest('[id^="vote-area-"]');
      if (!url || !voteArea) return;
      try {
        const html = await voteRequest(url);
        replaceVoteArea(voteArea, html);
      } catch (err) {
        console.error(err);
      }
    });

    promptEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        submitMessage();
      }
    });

    for (const message of initialMessages) {
      const role = message.role === 'user' ? 'user' : 'bot';
      appendMsg(
        message.content || '',
        role,
        false,
        message.msg_id || null,
        message.signed_msg_id || null,
        (message.vote === null || message.vote === undefined) ? null : Boolean(message.vote),
        message.sources || [],
        message.reason_code || null,
      );
    }

    connect();
    reportSession();

    const welcomeMessage = {{ welcome_message| tojson | safe }};
    if (!initialMessages.length && welcomeMessage) {
      appendMsg(welcomeMessage, 'bot');
    }

  </script>
</body>

</html>
