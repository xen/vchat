<html lang="ru" data-theme="light">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ _('Чат') }} - {{ project.title }}</title>
  <link rel="stylesheet" href="/static/chat/chat.css" />
  <script type="module" src="/static/chat/chat.js"></script>
  <style>
    .chat-bubble.markdown-body {
      max-width: 100%;
      overflow-x: hidden;
    }
  </style>
</head>

<body class="flex flex-col h-[100dvh] bg-base-100 text-base-content antialiased overflow-hidden"
  hx-headers='{"X-CSRFToken": "{{ support_csrf_token if support_csrf_token is defined else csrf_token() }}"}'>

  <!-- Навигация -->
  <header class="flex-none navbar bg-base-100 border-b border-base-200 shadow-sm z-10 min-h-12 px-4 gap-2">
    <div class="flex-1 gap-2 items-center">
      <div class="flex flex-col">
        <span class="font-bold text-sm leading-tight">{{ agent_name if agent_name else _('Виртуальный ассистент') }}</span>
      </div>
    </div>
    <div class="flex-none"></div>
  </header>

  <!-- Chat area + sidebar side by side -->
  <div style="flex: 1; display: flex; overflow: hidden; min-height: 0;">

    <!-- Left column: log + footer -->
    <div style="flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0;">
      <main id="log" class="flex-1 overflow-y-auto p-4 space-y-4 scroll-smooth">
        <!-- Messages will appear here -->
      </main>

      <!-- Footer Input -->
      <div class="flex-none bg-base-100 p-4 border-t border-base-200">
        <form id="composer" class="relative w-full">
          <textarea id="prompt"
            class="textarea textarea-bordered textarea-md w-full pr-12 resize-none bg-base-100 focus:outline-none" rows="2"
            placeholder="{{ _('Введите сообщение…') }}"></textarea>
          <button id="send" type="submit" class="btn btn-soft btn-primary btn-sm absolute bottom-3 right-3"
            aria-label="{{ _('Отправить') }}">
            {{ _('Отправить') }}
          </button>
        </form>
        <div id="status" class="text-xs text-left mt-2 opacity-50">
          <span class="badge badge-xs badge-warning mr-1"></span> {{ _('подключение…') }}
        </div>
      </div>
    </div>

    <!-- Resize handle — between left column and sidebar, always accessible -->
    <div id="sources-sidebar-resizer"
         style="width: 5px; flex-shrink: 0; cursor: col-resize; background: rgba(0,0,0,0.08); transition: background 0.15s;"
         onmouseenter="this.style.background='rgba(0,0,0,0.2)'"
         onmouseleave="this.style.background='rgba(0,0,0,0.08)'"></div>

    <!-- Sources Sidebar (part of layout, not overlay) -->
    <aside id="sources-sidebar"
      class="bg-base-100"
      style="width: 0; min-width: 0; flex-shrink: 0; display: flex; flex-direction: column; overflow: hidden; user-select: none;">
      <div style="flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0.75rem 1rem; min-width: 14rem;"
           class="border-b border-base-200">
        <span class="font-semibold text-sm">{{ _('Источники') }}</span>
        <button id="sources-sidebar-close" class="btn btn-ghost btn-xs btn-square">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
      <div id="sources-sidebar-list"
           style="flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.75rem; font-size: 0.875rem; user-select: text; min-width: 14rem;">
      </div>
    </aside>
  </div>

  <script type="module">
    const statusEl = document.getElementById('status');
    const logEl = document.getElementById('log');
    const formEl = document.getElementById('composer');
    const promptEl = document.getElementById('prompt');
    const sendBtn = document.getElementById('send');
    const csrfToken = {{ csrf_token() | tojson | safe }};
    const initialMessages = {{ initial_messages|default([])|tojson|safe }};
    const signedChatId = {{ signed_chat_id|default(None)|tojson|safe }};

    let ws;
    let currentBotBubble = null;

    const sidebarEl = document.getElementById('sources-sidebar');
    const sidebarListEl = document.getElementById('sources-sidebar-list');
    const sidebarCloseEl = document.getElementById('sources-sidebar-close');
    const sidebarResizerEl = document.getElementById('sources-sidebar-resizer');

    let sidebarOpen = false;

    function escapeHtml(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function setSidebarContent(sources) {
      sidebarListEl.innerHTML = sources.map((s) => {
        const title = escapeHtml(s.title || '{{ _("Источник") }}');
        const href = escapeHtml(s.uri || '#');
        return `<a href="${href}" target="_blank" rel="noopener" style="color: var(--color-primary, #6366f1); word-break: break-word; line-height: 1.4; text-decoration: none;" onmouseover="this.style.textDecoration='underline'" onmouseout="this.style.textDecoration='none'">${title}</a>`;
      }).join('');
    }

    const SIDEBAR_WIDTH = Math.max(224, Math.round(window.innerWidth * 0.33));

    function openSidebar(sources) {
      setSidebarContent(sources);
      if (!sidebarOpen) {
        sidebarOpen = true;
        sidebarEl.style.transition = 'none';
        sidebarEl.style.width = '0';
        requestAnimationFrame(() => {
          sidebarEl.style.transition = 'width 0.2s ease-in-out';
          sidebarEl.style.width = SIDEBAR_WIDTH + 'px';
        });
      }
    }

    function closeSidebar() {
      sidebarOpen = false;
      sidebarEl.style.transition = 'width 0.2s ease-in-out';
      sidebarEl.style.width = '0';
    }

    sidebarCloseEl.addEventListener('click', closeSidebar);

    // Resize: drag the handle to change sidebar width
    sidebarResizerEl.addEventListener('mousedown', (e) => {
      e.preventDefault();
      sidebarEl.style.transition = 'none';
      const startX = e.clientX;
      const startW = sidebarEl.getBoundingClientRect().width || SIDEBAR_WIDTH;
      const vw = window.innerWidth;

      function onMove(e) {
        const delta = startX - e.clientX;
        const newW = Math.min(Math.max(startW + delta, 224), vw * 0.6);
        sidebarEl.style.width = newW + 'px';
        sidebarOpen = true;
      }
      function onUp() {
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        if (!sidebarOpen) closeSidebar();
      }
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });

    function wsUrl() {
      const payload = '{{ payload }}';
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      return `${proto}://${location.host}/ws/chat/${payload}`;
    }

    function updateStatus(text, type) {
      let badgeClass = 'badge-warning';
      if (type === 'подключено') badgeClass = 'badge-success';
      if (type === 'error') badgeClass = 'badge-error';

      statusEl.innerHTML = `<span class="badge badge-xs ${badgeClass} mr-1"></span> ${text}`;
    }

    function attachStructuredContext(bubble, sources = [], reasonCode = null) {
      if (!bubble) {
        return;
      }
      bubble.querySelectorAll('[data-structured-context="true"]').forEach((node) => node.remove());

      if (sources && sources.length > 0) {
        const citationMap = {};
        for (const s of sources) {
          if (s.citation_id !== undefined && s.citation_id !== null) {
            citationMap[String(s.citation_id)] = s;
          }
        }
        bubble.querySelectorAll('.citation-btn').forEach((btn) => {
          const src = citationMap[btn.dataset.id];
          if (src?.uri) {
            const a = document.createElement('a');
            a.href = src.uri;
            a.target = '_blank';
            a.rel = 'noopener';
            a.className = btn.className;
            a.dataset.id = btn.dataset.id;
            a.innerHTML = btn.innerHTML;
            a.classList.remove('citation-btn');
            a.classList.add('citation-link');
            btn.replaceWith(a);
          }
        });
      }

      if (!sources || sources.length === 0) {
        return;
      }

      const seen = new Set();
      const unique = sources.filter((s) => {
        const key = s.uri || s.title;
        if (!key || seen.has(key)) return false;
        seen.add(key);
        return true;
      });
      if (unique.length === 0) {
        return;
      }

      const count = unique.length;
      const label = count === 1
        ? '{{ _("1 источник") }}'
        : count < 5
          ? `${count} {{ _("источника") }}`
          : `${count} {{ _("источников") }}`;

      const wrapper = document.createElement('div');
      wrapper.setAttribute('data-structured-context', 'true');

      const btn = document.createElement('button');
      btn.type = 'button';
      btn.style.cssText = 'display: inline-flex; align-items: center; gap: 0.375rem; margin-top: 0.5rem; padding: 0.25rem 0.75rem; font-size: 0.75rem; border-radius: 9999px; border: 1.5px solid rgba(0,0,0,0.3); background: transparent; cursor: pointer; transition: border-color 0.15s, background 0.15s;';
      btn.onmouseenter = () => { btn.style.background = 'rgba(0,0,0,0.05)'; btn.style.borderColor = 'rgba(0,0,0,0.5)'; };
      btn.onmouseleave = () => { btn.style.background = 'transparent'; btn.style.borderColor = 'rgba(0,0,0,0.3)'; };
      btn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" style="width:0.875rem;height:0.875rem;flex-shrink:0;" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg><span>${label}</span>`;
      btn.addEventListener('click', () => openSidebar(unique));

      wrapper.appendChild(btn);
      bubble.appendChild(wrapper);
    }

    function ensureVoteArea(chatDiv, msgId, signedMsgId, vote = null) {
      if (!chatDiv || !signedMsgId) {
        return;
      }
      const areaId = `vote-area-${msgId}`;
      const existing = chatDiv.querySelector(`#${areaId}`);
      if (existing) {
        existing.remove();
      }
      const footer = document.createElement('div');
      footer.className = 'chat-footer opacity-50 flex gap-2 items-center mt-1';
      footer.id = areaId;
      footer.innerHTML = `
        <button class="btn btn-ghost btn-xs btn-square ${vote === true ? 'text-primary' : ''}"
                aria-label="Upvote"
                hx-post="/actions/chat/vote/${signedMsgId}?vote=${vote === true ? 'none' : 'up'}"
                data-vote-url="/actions/chat/vote/${signedMsgId}?vote=${vote === true ? 'none' : 'up'}"
                hx-swap="outerHTML"
                hx-target="#${areaId}">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path d="M2 10.5a1.5 1.5 0 113 0v6a1.5 1.5 0 01-3 0v-6zM6 10.333v5.43a2 2 0 001.106 1.79l.05.025A4 4 0 008.943 18h5.416a2 2 0 001.962-1.608l1.2-6A2 2 0 0015.56 8H12V4a2 2 0 00-2-2 1 1 0 00-1 1v.667a4 4 0 01-.8 2.4L6.8 7.933a4 4 0 00-.8 2.4z" /></svg>
        </button>
        <button class="btn btn-ghost btn-xs btn-square ${vote === false ? 'text-primary' : ''}"
                aria-label="Downvote"
                hx-post="/actions/chat/vote/${signedMsgId}?vote=${vote === false ? 'none' : 'down'}"
                data-vote-url="/actions/chat/vote/${signedMsgId}?vote=${vote === false ? 'none' : 'down'}"
                hx-swap="outerHTML"
                hx-target="#${areaId}">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path d="M18 9.5a1.5 1.5 0 11-3 0v-6a1.5 1.5 0 013 0v6zM14 9.667v-5.43a2 2 0 00-1.105-1.79l-.05-.025A4 4 0 0011.055 2H5.64a2 2 0 00-1.962 1.608l-1.2 6A2 2 0 004.44 12H8v4a2 2 0 002 2 1 1 0 001-1v-.667a4 4 0 01.8-2.4l1.4-1.866a4 4 0 00.8-2.4z" /></svg>
        </button>
      `;
      chatDiv.appendChild(footer);
      if (window.htmx && typeof window.htmx.process === 'function') {
        window.htmx.process(footer);
      }
    }

    function appendMsg(text, type = 'bot', isPartial = false, msgId = null, signedMsgId = null, vote = null, sources = [], reasonCode = null) {
      if (type === 'bot' && isPartial && currentBotBubble) {
        const rawText = (currentBotBubble.dataset.raw || '') + text;
        currentBotBubble.dataset.raw = rawText;
        currentBotBubble.querySelector('.markdown-body').innerHTML = marked.parse(rawText);
        logEl.scrollTop = logEl.scrollHeight;
        return;
      } else {
        const chatDiv = document.createElement('div');
        chatDiv.className = type === 'bot' ? 'chat chat-start' : 'chat chat-end';

        if (type === 'bot') {
          const header = document.createElement('div');
          header.className = 'chat-header text-xs opacity-50 mb-1';
          header.textContent = '{{ agent_name if agent_name else "Ассистент" }}';
          chatDiv.appendChild(header);
        }

        const bubble = document.createElement('div');
        bubble.className = type === 'bot'
          ? 'chat-bubble chat-bubble-base-200 w-full max-w-sm sm:max-w-md md:max-w-lg'
          : 'chat-bubble chat-bubble-primary text-primary-content';

        if (type === 'bot') {
          bubble.dataset.raw = text;
          bubble.innerHTML = `<div class="markdown-body">${marked.parse(text)}</div>`;
          if (isPartial) {
            currentBotBubble = bubble;
          }
          if (!isPartial) {
            attachStructuredContext(bubble, sources, reasonCode);
          }
          chatDiv.appendChild(bubble);
          if (!isPartial && signedMsgId) {
            ensureVoteArea(chatDiv, msgId, signedMsgId, vote);
          }
        } else {
          if (type === 'error') {
            bubble.className = 'chat-bubble chat-bubble-error text-error-content';
            bubble.textContent = text;
          } else {
            bubble.textContent = text;
          }
          currentBotBubble = null;
          chatDiv.appendChild(bubble);
        }

        logEl.appendChild(chatDiv);
      }
      logEl.scrollTop = logEl.scrollHeight;
    }

    function setSending(sending) {
      sendBtn.disabled = sending;
      promptEl.disabled = sending;
      if (!sending) {
        promptEl.focus();
      }
    }

    async function voteRequest(url, formData = null) {
      const headers = {
        'X-CSRFToken': csrfToken,
      };
      const init = {
        method: 'POST',
        headers,
      };
      if (formData) {
        init.body = formData;
      }
      const resp = await fetch(url, init);
      if (!resp.ok) {
        const text = await resp.text();
        throw new Error(`Vote request failed: ${resp.status} ${text}`);
      }
      return resp.text();
    }

    function replaceVoteArea(currentArea, html) {
      if (!currentArea || !html) return;
      const template = document.createElement('template');
      template.innerHTML = html.trim();
      const nextArea = template.content.firstElementChild;
      if (!nextArea) return;
      currentArea.replaceWith(nextArea);
      if (window.htmx && typeof window.htmx.process === 'function') {
        window.htmx.process(nextArea);
      }
    }

    async function reportSession() {
      if (!signedChatId || typeof window.vchatGetFingerprint !== 'function') {
        return;
      }
      try {
        const payload = await window.vchatGetFingerprint();
        await fetch(`/actions/chat/session/${signedChatId}`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': csrfToken,
          },
          credentials: 'same-origin',
          body: JSON.stringify(payload),
        });
      } catch (error) {
        console.warn('Failed to report chat session metadata', error);
      }
    }

    function connect() {
      ws = new WebSocket(wsUrl());
      ws.onopen = () => {
        updateStatus('{{ _("подключено") }}', 'подключено');
      };
      ws.onclose = () => {
        updateStatus('{{ _("отключено") }}', 'warning');
        setSending(false);
        currentBotBubble = null;
      };
      ws.onerror = () => {
        updateStatus('{{ _("ошибка") }}', 'error');
        setSending(false);
        currentBotBubble = null;
      };
      ws.onmessage = (ev) => {
        let data;
        try {
          data = JSON.parse(ev.data);
        } catch (e) {
          console.error('WS parse error', e, ev.data);
          return;
        }

        try {
          if (data.type === 'suggested_actions') {
            if (data.actions && data.actions.length > 0) {
              const actionsDiv = document.createElement('div');
              actionsDiv.className = 'pl-12 flex flex-wrap gap-2 mb-4'; // Added margin-bottom for spacing
              data.actions.forEach(action => {
                const btn = document.createElement('button');
                btn.className = 'btn btn-xs btn-outline bg-base-100';
                btn.textContent = action;
                btn.onclick = () => {
                  promptEl.value = action;
                  submitMessage();
                  actionsDiv.remove();
                };
                actionsDiv.appendChild(btn);
              });
              logEl.appendChild(actionsDiv);
              logEl.scrollTop = logEl.scrollHeight;
            }
          } else if (data.ok) {
            if (data.partial) {
              if (data.content) {
                appendMsg(data.content, 'bot', true);
              }
            } else if (currentBotBubble) {
              if (data.content) {
                const rawText = (currentBotBubble.dataset.raw || '') + data.content;
                currentBotBubble.dataset.raw = rawText;
                currentBotBubble.querySelector('.markdown-body').innerHTML = marked.parse(rawText);
              }
              attachStructuredContext(currentBotBubble, data.sources || [], data.reason_code || null);
              const chatDiv = currentBotBubble.closest('.chat');
              if (chatDiv && data.signed_msg_id) {
                ensureVoteArea(chatDiv, data.msg_id, data.signed_msg_id);
              }
              setSending(false);
              currentBotBubble = null;
            } else {
              appendMsg(
                data.content || '',
                'bot',
                false,
                data.msg_id,
                data.signed_msg_id,
                null,
                data.sources || [],
                data.reason_code || null,
              );
              setSending(false);
            }
          } else {
            appendMsg(`Ошибка: ${data.error} ${data.status ? '(' + data.status + ')' : ''}\n${typeof data.detail === 'string' ? data.detail : JSON.stringify(data.detail)}`, 'error');
            setSending(false);
          }
        } catch (e) {
          console.error('WS handler error', e, data);
          setSending(false);
        }
      };
    }


    const submitMessage = (options = {}) => {
      const providedText = typeof options.text === 'string' ? options.text : null;
      const text = (providedText !== null ? providedText : promptEl.value).trim();
      if (!text) return;

      appendMsg(text, 'user');
      setSending(true);

      const payload = options.triggerId
        ? JSON.stringify({ type: 'trigger_prompt', page_token: options.pageToken || null, trigger_key: options.triggerId, text })
        : text;

      if (!ws || ws.readyState !== WebSocket.OPEN) {
        connect();
        setTimeout(() => ws && ws.send(payload), 100);
      } else {
        ws.send(payload);
      }
      if (providedText === null) {
        promptEl.value = '';
      }
    };

    formEl.addEventListener('submit', (e) => {
      e.preventDefault();
      submitMessage();
    });

    logEl.addEventListener('click', async (e) => {
      const btn = e.target.closest('[data-vote-url]');
      if (!btn) return;
      e.preventDefault();
      const url = btn.getAttribute('data-vote-url');
      const voteArea = btn.closest('[id^="vote-area-"]');
      if (!url || !voteArea) return;
      try {
        const html = await voteRequest(url);
        replaceVoteArea(voteArea, html);
      } catch (err) {
        console.error(err);
      }
    });

    promptEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        submitMessage();
      }
    });

    window.addEventListener('message', (event) => {
      const data = event.data || {};
      if (!data || data.type !== 'vchat_trigger') {
        return;
      }
      const text = String(data.text || '').trim();
      if (!text) {
        return;
      }
      submitMessage({
        text,
        pageToken: data.page_token || null,
        triggerId: data.trigger_key || null,
      });
    });

    for (const message of initialMessages) {
      const role = message.role === 'user' ? 'user' : 'bot';
      appendMsg(
        message.content || '',
        role,
        false,
        message.msg_id || null,
        message.signed_msg_id || null,
        (message.vote === null || message.vote === undefined) ? null : Boolean(message.vote),
        message.sources || [],
        message.reason_code || null,
      );
    }

    connect();
    reportSession();

    const welcomeMessage = {{ welcome_message| tojson | safe }};
    if (!initialMessages.length && welcomeMessage) {
      appendMsg(welcomeMessage, 'bot');
    }

  </script>
</body>

</html>
