{% extends "error.html" %}

{% block content %}

<main class="bg-gray-50 dark:bg-gray-900">
  <div class="flex flex-col justify-center items-center px-6 mx-auto h-screen xl:px-0 dark:bg-gray-900">
    <div class="text-center xl:max-w-4xl">
      <h1 class="mb-3 text-2xl font-bold leading-tight text-gray-900 sm:text-4xl lg:text-5xl dark:text-white">{{ _("Ошибка 405: Метод не разрешен") }}</h1>
      <p class="mb-3 text-base font-normal text-gray-500 md:text-lg dark:text-gray-400">{{ _("You are trying to access the page <code class='font-mono font-medium text-xs leading-6 text-sky-500 whitespace-nowrap dark:text-sky-400'>{url}</code> by methods that are not allowed.".format(url=request.path_qs))|safe }}</p>
      <p class="mb-5 text-base font-normal text-gray-500 md:text-lg dark:text-gray-400">
        <a href="https://dzen.dev?from=vchat" target="_blank" rel="noopener">{{ _("Please contact us.") }}</a>
      </p>
    </div>
  </div>
</main>

{% endblock %}
