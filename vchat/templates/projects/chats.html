{% extends "admin.html" %}
{% block content %}

<div class="flex items-center justify-between">
    <h1 class="text-lg font-medium">{{ 'История чатов' }}</h1>
</div>

<div class="card bg-base-100 shadow mt-4">
    <div class="p-4 border-b border-base-200">
        <h2 class="text-lg font-medium">{{ 'Активные чаты' }}</h2>
    </div>
    <div class="p-2">
        {% for chat in active_chats %}
        <a class="block p-3 hover:bg-base-200 rounded-box mb-1"
           href="{{ url('project_history_detail', chat_id=chat.id) }}">
            <div class="flex items-center gap-3">
                <div class="avatar placeholder">
                    <div class="bg-neutral text-neutral-content rounded-full w-10">
                        <span class="text-xs">{{ chat.user_uid[:2] }}</span>
                    </div>
                </div>
                <div>
                    <div class="font-medium">{{ chat.title or chat.user_uid }}</div>
                    <div class="text-xs text-base-content/60">{{ chat.created_at.strftime('%H:%M') }}</div>
                </div>
            </div>
        </a>
        {% else %}
        <div class="p-4 text-center text-base-content/60">
            {{ 'Нет активных чатов' }}
        </div>
        {% endfor %}
    </div>
</div>

{% endblock %}
