{% extends "admin.html" %}
{% block content %}

{% if current_document %}
<div class="flex items-start justify-between gap-4 mb-6">
    <div class="min-w-0">
        <h1 class="text-lg font-medium break-words">
            <a href="{{ url('project_files') }}" class="text-base-content/50 transition-colors hover:text-base-content">Файлы</a>
            <span class="mx-2 text-base-content/40">&gt;</span>
            <span class="text-base-content">{{ current_document.title or ('Файл #' ~ current_document.id) }}</span>
        </h1>
    </div>
</div>

<div class="card bg-base-100 shadow">
    <div class="card-body">
        <form id="file-editor-form" method="post" action="{{ url('file_document', document_id=current_document.id) }}" class="space-y-4">
            <input type="hidden" id="content" name="content" value="{{ current_document.content or '' }}" />
            <textarea
                id="content-fallback"
                class="textarea textarea-bordered w-full font-mono"
                style="height: min(72vh, calc(100vh - 240px)); min-height: 420px;"
                spellcheck="false"
            >{{ current_document.content or '' }}</textarea>
            <div
                id="monaco-editor"
                class="w-full rounded border border-base-300 hidden"
                style="height: min(72vh, calc(100vh - 240px)); min-height: 420px;"
            ></div>

            <div class="flex items-center justify-end pt-2">
                <button type="submit" name="action" value="save" class="btn btn-primary">Сохранить</button>
            </div>
        </form>
    </div>
</div>

<script src="/static/assets/monaco-editor/vs/loader.js"></script>
<script>
    (function () {
        const form = document.getElementById('file-editor-form');
        const contentInput = document.getElementById('content');
        const editorTarget = document.getElementById('monaco-editor');
        const fallbackEditor = document.getElementById('content-fallback');

        if (!form || !contentInput || !editorTarget || !fallbackEditor) {
            return;
        }

        form.addEventListener('submit', function () {
            contentInput.value = fallbackEditor.value;
        });

        if (!window.require) {
            return;
        }

        const theme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'vs-dark' : 'vs';

        window.require.config({
            paths: { vs: '/static/assets/monaco-editor/vs' }
        });

        window.require(['vs/editor/editor.main'], function () {
            editorTarget.classList.remove('hidden');
            const editor = monaco.editor.create(editorTarget, {
                value: fallbackEditor.value || contentInput.value || '',
                language: 'markdown',
                theme: theme,
                automaticLayout: true,
                minimap: { enabled: true },
                wordWrap: 'on',
                fontSize: 14,
                scrollBeyondLastLine: false,
            });

            fallbackEditor.classList.add('hidden');

            form.addEventListener('submit', function () {
                contentInput.value = editor.getValue();
            });
        });
    })();
</script>
{% else %}
<div class="flex items-center justify-between gap-3 mb-6">
    <h1 class="text-lg font-medium">Файлы</h1>
    <form method="post" action="{{ url('project_files') }}">
        <button type="submit" class="btn btn-primary btn-sm max-sm:btn-square">
            <iconify-icon icon="lucide:plus" class="size-4"></iconify-icon>
            <span class="hidden sm:inline">Добавить файл</span>
        </button>
    </form>
</div>

<div class="card bg-base-100 shadow" x-data="useProjectFilesTable()">
    <div class="card-body p-0">
        <div class="border-base-200 flex items-center gap-3 border-b border-dashed px-5 py-4 flex-wrap">
            <label class="input input-sm flex-1 min-w-[180px]">
                <iconify-icon icon="lucide:search" class="text-base-content/70 size-4.5"></iconify-icon>
                <input
                    class="text-base placeholder:text-sm"
                    type="search"
                    x-model="search"
                    @input="updateSearch"
                    placeholder="Поиск по названию или автору..." />
            </label>
            <label class="select select-sm w-48 shrink-0">
                <iconify-icon icon="lucide:users" class="text-base-content/70 size-4.5"></iconify-icon>
                <select x-model="authorFilter" @change="updateAuthorFilter">
                    <option value="">Все авторы</option>
                    <template x-for="author in authorOptions" :key="author">
                        <option :value="author" x-text="author"></option>
                    </template>
                </select>
            </label>
        </div>
        <div class="border-base-200 border-b border-dashed px-5 py-3" x-show="!loading && pageCount > 1">
            <div class="flex items-center gap-3">
                <span class="text-xs text-base-content/50 shrink-0 tabular-nums">
                    <span x-text="pageIndex + 1"></span> / <span x-text="pageCount"></span>
                </span>
                <input
                    type="range"
                    class="range range-xs range-primary w-full"
                    :min="0"
                    :max="pageCount - 1"
                    step="1"
                    :value="pageIndex"
                    @input="setPageIndex(Number($event.target.value))"
                />
                <p class="text-base-content/70 text-sm shrink-0">
                    Показано
                    <span class="text-base-content font-medium" x-text="rangeStart"></span>–<span class="text-base-content font-medium" x-text="rangeEnd"></span>
                    из
                    <span class="text-base-content font-medium" x-text="filteredRowCount"></span>
                </p>
            </div>
        </div>
        <div class="overflow-x-auto min-h-[280px]">
            <div x-show="loading" class="flex justify-center items-center h-40">
                <span class="loading loading-spinner loading-lg text-primary"></span>
            </div>
            <table class="table w-full" style="table-layout:fixed" x-show="!loading">
                <thead x-ref="filesHead">
                    <template x-for="headerGroup in headerGroups" :key="headerGroup.id">
                        <tr>
                            <template x-for="header in headerGroup.headers" :key="header.id">
                                <th
                                    x-bind:style="header.column.columnDef.meta?.thStyle"
                                    x-html="flexRender(header.column.columnDef.header, header.getContext())"
                                ></th>
                            </template>
                        </tr>
                    </template>
                </thead>
                <tbody x-ref="filesBody">
                    <template x-if="visibleRows.length === 0">
                        <tr>
                            <td colspan="5" class="text-center text-base-content/60 py-8">
                                Файлов пока нет.
                            </td>
                        </tr>
                    </template>
                    <template x-for="row in visibleRows" :key="row.id">
                        <tr>
                            <template x-for="cell in row.getVisibleCells()" :key="cell.id">
                                <td
                                    x-bind:style="cell.column.columnDef.meta?.tdStyle"
                                    x-bind:class="cell.column.columnDef.meta?.tdClass"
                                    x-html="flexRender(cell.column.columnDef.cell, cell.getContext())"
                                ></td>
                            </template>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endif %}

{% endblock %}
