{% extends "admin.html" %}
{% block content %}

<div class="flex items-center justify-between">
    <p class="text-lg font-medium">Страницы</p>
</div>

<div class="mt-6" x-data="useProjectDataTable()">
    <div class="card bg-base-100 shadow">
        <div class="card-body p-0">
            <!-- Toolbar -->
            <div class="border-base-200 flex items-center gap-3 border-b border-dashed px-5 py-5">
                <label class="input input-sm flex-1">
                    <iconify-icon icon="lucide:search" class="text-base-content/70 size-4.5"></iconify-icon>
                    <input
                        class="text-base placeholder:text-sm"
                        type="search"
                        x-model="search"
                        @input="updateSearch"
                        placeholder="Поиск по названию или URL..." />
                </label>
                <label class="select select-sm w-48 shrink-0">
                    <iconify-icon icon="lucide:filter" class="text-base-content/70 size-4.5"></iconify-icon>
                    <select x-model="sourceFilter" @change="updateSourceFilter">
                        <option value="">Все источники</option>
                        {% for source_name in source_filters %}
                            <option value="{{ source_name }}">{{ source_name }}</option>
                        {% endfor %}
                    </select>
                </label>
            </div>

            <!-- Table -->
            <div class="overflow-x-auto min-h-[300px]">
                <div x-show="loading" class="flex justify-center items-center h-40">
                    <span class="loading loading-spinner loading-lg text-primary"></span>
                </div>
                <table class="table w-full" style="table-layout:fixed" x-show="!loading">
                    <thead x-ref="documentsHead">
                        <template x-for="headerGroup in headerGroups" :key="headerGroup.id">
                            <tr>
                                <template x-for="header in headerGroup.headers" :key="header.id">
                                    <th
                                        x-bind:style="header.column.columnDef.meta?.thStyle"
                                        x-html="flexRender(header.column.columnDef.header, header.getContext())"
                                    ></th>
                                </template>
                            </tr>
                        </template>
                    </thead>
                    <tbody x-ref="documentsBody">
                        <template x-if="visibleRows.length === 0">
                            <tr>
                                <td colspan="9" class="text-center text-base-content/60 py-8">
                                    Документы не найдены.
                                </td>
                            </tr>
                        </template>
                        <template x-for="row in visibleRows" :key="row.id">
                            <tr :class="row.original?.is_ignored ? 'bg-base-200/50 opacity-60' : ''">
                                <template x-for="cell in row.getVisibleCells()" :key="cell.id">
                                    <td
                                        x-bind:style="cell.column.columnDef.meta?.tdStyle"
                                        x-bind:class="cell.column.columnDef.meta?.tdClass"
                                        x-html="flexRender(cell.column.columnDef.cell, cell.getContext())"
                                    ></td>
                                </template>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <div class="border-base-200 border-t border-dashed px-5 py-3" x-show="!loading && pageCount > 1">
                <div class="flex items-center gap-3">
                    <span class="text-xs text-base-content/50 shrink-0 tabular-nums">
                        <span x-text="pageIndex + 1"></span><span class="opacity-50"> / <span x-text="pageCount"></span></span>
                    </span>
                    <input
                        type="range"
                        class="range range-xs range-primary w-full"
                        style="--range-fill: 0; width: 100%"
                        :min="0"
                        :max="pageCount - 1"
                        step="1"
                        :value="pageIndex"
                        @input="setPageIndex(Number($event.target.value))"
                    />
                    <p class="text-base-content/70 text-sm shrink-0">
                        Показано
                        <span class="text-base-content font-medium" x-text="rangeStart"></span>–<span class="text-base-content font-medium" x-text="rangeEnd"></span>
                        из
                        <span class="text-base-content font-medium" x-text="filteredRowCount"></span>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Document Content Modal -->
<dialog id="document_modal" class="modal">
    <div class="modal-box w-11/12 max-w-5xl h-[80vh] p-0 flex flex-col">
        <div class="flex items-center justify-between p-4 border-b">
            <h3 class="font-bold text-lg">Содержимое документа</h3>
            <form method="dialog">
                <button class="btn btn-sm btn-circle btn-ghost">✕</button>
            </form>
        </div>
        <div id="document-content" class="p-6 overflow-y-auto flex-1 prose max-w-none">
            <!-- Content will be loaded here via HTMX -->
        </div>
    </div>
    <form method="dialog" class="modal-backdrop">
        <button>Закрыть</button>
    </form>
</dialog>

{% endblock %}
