{% extends "admin.html" %}
{% block content %}

<div class="flex items-center justify-between">
    <h1 class="text-lg font-medium">Страницы</h1>
</div>

<div class="mt-6" x-data="useProjectDataTable()">
    <div class="card bg-base-100 shadow">
        <div class="card-body p-0">
            <!-- Toolbar -->
            <div class="border-base-200 flex items-center gap-3 border-b border-dashed px-5 py-4 flex-wrap">
                <label class="input input-sm flex-1 min-w-[180px]">
                    <iconify-icon icon="lucide:search" class="text-base-content/70 size-4.5"></iconify-icon>
                    <input
                        class="text-base placeholder:text-sm"
                        type="search"
                        x-model="search"
                        @input="updateSearch($event)"
                        @search="updateSearch($event)"
                        placeholder="Поиск по названию или URL..." />
                </label>
                <label class="select select-sm w-56 shrink-0 gap-2 max-sm:w-full">
                    <iconify-icon icon="lucide:filter" class="text-base-content/70 size-4.5 pointer-events-none relative z-10 shrink-0"></iconify-icon>
                    <select class="ml-2 min-w-0 truncate" x-model="sourceFilter" @change="updateSourceFilter">
                        <option value="">Все источники</option>
                        {% for source_name in source_filters %}
                            <option value="{{ source_name }}">{{ source_name }}</option>
                        {% endfor %}
                    </select>
                </label>
            </div>
            <!-- Group filter chips -->
            <div class="border-base-200 flex items-center gap-1.5 border-b border-dashed px-5 py-2 flex-wrap">
                <button @click="setGroupFilter('errors')"
                        :class="groupFilter === 'errors' ? 'btn-error' : 'btn-ghost text-error/70'"
                        class="btn btn-xs">
                    Ошибки
                </button>
                <button @click="setGroupFilter('pending')"
                        :class="groupFilter === 'pending' ? 'btn-warning' : 'btn-ghost text-warning/70'"
                        class="btn btn-xs">
                    Ожидает
                </button>
                <button @click="setGroupFilter('processing')"
                        :class="groupFilter === 'processing' ? 'btn-success' : 'btn-ghost text-success/70'"
                        class="btn btn-xs">
                    В обработке
                </button>
                <button @click="setGroupFilter('ready')"
                        :class="groupFilter === 'ready' ? 'bg-purple-500 text-white border-purple-500' : 'btn-ghost text-purple-600/70'"
                        class="btn btn-xs">
                    Готово
                </button>
                <button @click="setGroupFilter('excluded')"
                        :class="groupFilter === 'excluded' ? 'btn-neutral' : 'btn-ghost text-base-content/50'"
                        class="btn btn-xs">
                    Игнорировано
                </button>
                <button @click="setGroupFilter('')"
                        :class="groupFilter === '' ? 'btn-neutral' : 'btn-ghost text-base-content/60'"
                        class="btn btn-xs">
                    Все
                </button>
            </div>

            <!-- Pagination -->
            <div class="border-base-200 border-b border-dashed px-5 py-3" x-show="!loading">
                <div class="flex items-center gap-3">
                    <span class="text-xs text-base-content/50 shrink-0 tabular-nums">
                        <span x-text="pageIndex + 1"></span> / <span x-text="Math.max(pageCount, 1)"></span>
                    </span>
                    <input
                        type="range"
                        class="range range-xs range-primary w-full"
                        style="--range-fill: 0; width: 100%"
                        :min="0"
                        :max="Math.max(pageCount - 1, 0)"
                        step="1"
                        :value="pageIndex"
                        :disabled="pageCount <= 1"
                        @input="setPageIndex(Number($event.target.value))"
                    />
                    <p class="text-base-content/70 text-sm shrink-0">
                        Показано
                        <span class="text-base-content font-medium" x-text="rangeStart"></span>–<span class="text-base-content font-medium" x-text="rangeEnd"></span>
                        из
                        <span class="text-base-content font-medium" x-text="filteredRowCount"></span>
                    </p>
                </div>
            </div>

            <!-- Table -->
            <div class="overflow-x-auto min-h-[300px]">
                <div x-show="loading" class="flex justify-center items-center h-40">
                    <span class="loading loading-spinner loading-lg text-primary"></span>
                </div>
                <table class="table w-full" style="table-layout:fixed" x-show="!loading">
                    <thead x-ref="documentsHead">
                        <template x-for="headerGroup in headerGroups" :key="headerGroup.id">
                            <tr>
                                <template x-for="header in headerGroup.headers" :key="header.id">
                                    <th
                                        x-bind:style="header.column.columnDef.meta?.thStyle"
                                        x-html="flexRender(header.column.columnDef.header, header.getContext())"
                                    ></th>
                                </template>
                            </tr>
                        </template>
                    </thead>
                    <tbody x-ref="documentsBody">
                        <template x-if="visibleRows.length === 0">
                            <tr>
                                <td colspan="3" class="text-center text-base-content/60 py-8">
                                    Документы не найдены.
                                </td>
                            </tr>
                        </template>
                        <template x-for="row in visibleRows" :key="row.id">
                            <tr :class="row.original?.is_ignored ? 'bg-base-200/50 opacity-60' : ''">
                                <template x-for="cell in row.getVisibleCells()" :key="cell.id">
                                    <td
                                        x-bind:style="cell.column.columnDef.meta?.tdStyle"
                                        x-bind:class="cell.column.columnDef.meta?.tdClass"
                                        x-html="flexRender(cell.column.columnDef.cell, cell.getContext())"
                                    ></td>
                                </template>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Document Content Modal -->
<dialog id="document_modal" class="modal">
    <div class="modal-box w-11/12 max-w-5xl h-[80vh] p-0 flex flex-col">
        <div class="flex items-center justify-between p-4 border-b">
            <h3 class="font-bold text-lg">Содержимое документа</h3>
            <form method="dialog">
                <button class="btn btn-sm btn-circle btn-ghost">✕</button>
            </form>
        </div>
        <div id="document-content" class="p-6 overflow-y-auto flex-1 prose max-w-none">
            <!-- Content will be loaded here via HTMX -->
        </div>
    </div>
    <form method="dialog" class="modal-backdrop">
        <button>Закрыть</button>
    </form>
</dialog>

{% endblock %}
