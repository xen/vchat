{% extends "admin.html" %}
{% block content %}

<div class="flex flex-col gap-6">
    <div class="min-w-0">
        <div class="flex items-center justify-between gap-4">
            <h1 class="text-lg font-medium break-words">{{ document_display_title }}</h1>
            {% if document.source_id and document.uri %}
            <button hx-post="{{ url('actions', action='refresh_page', item_id=document.id) }}"
                    hx-swap="none"
                    hx-on::after-request="if(event.detail.successful) window.location.reload()"
                    class="btn btn-secondary btn-sm gap-2 shrink-0">
                <iconify-icon icon="lucide:refresh-cw" class="size-4"></iconify-icon>
                Обновить
            </button>
            {% endif %}
        </div>
        <div class="mt-2">
            <a href="{{ url('project_view') }}" class="inline-flex items-center gap-1.5 text-sm text-base-content/60 hover:text-base-content">
                <iconify-icon icon="lucide:arrow-left" class="size-4"></iconify-icon>
                Страницы
            </a>
            {% if document.uri %}
            <p class="mt-1 text-sm break-all text-base-content/60">
                <a href="{{ document.uri }}" class="link link-hover" target="_blank" rel="noopener noreferrer">{{ document.uri }}</a>
            </p>
            {% endif %}
        </div>
    </div>

    {% include "projects/document_content.html" %}
</div>

{% endblock %}
