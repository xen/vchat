{% extends "admin.html" %}
{% block content %}

<div class="flex flex-col gap-4">
    <div class="flex items-center justify-between gap-3">
        <div class="flex items-center gap-3">
            <a href="{{ url('project_view') }}" class="btn btn-sm btn-ghost gap-2">
                <iconify-icon icon="lucide:arrow-left" class="size-4"></iconify-icon>
                Назад
            </a>
            <div>
                <h1 class="text-xl font-semibold">Структура документа</h1>
                <p class="text-sm opacity-70">{{ document_display_title }}</p>
            </div>
        </div>
        {% if document.source_id and document.uri %}
        <button hx-post="{{ url('actions', action='refresh_page', item_id=document.id) }}"
                hx-swap="none"
                hx-on::after-request="if(event.detail.successful) window.location.reload()"
                class="btn btn-sm btn-outline gap-2">
            <iconify-icon icon="lucide:refresh-cw" class="size-4"></iconify-icon>
            Обновить
        </button>
        {% endif %}
    </div>

    {% include "projects/document_content.html" %}
</div>

{% endblock %}
