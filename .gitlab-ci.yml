# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/user/application_security/sast/#available-cicd-variables
# Secret Detection customization: https://docs.gitlab.com/user/application_security/secret_detection/pipeline/configure/
# Dependency Scanning customization: https://docs.gitlab.com/user/application_security/dependency_scanning/#customizing-analyzer-behavior
# Container Scanning customization: https://docs.gitlab.com/user/application_security/container_scanning/#customizing-analyzer-behavior
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ci/variables/#cicd-variable-precedence
".x-commit-cache":
  key:
    files:
    - requirements/requirements.txt
  paths:
  - "${CI_PROJECT_DIR}/.cache"
  policy: pull-push
stages:
- test
- deploy
- build
- review
- dast
- staging
- canary
- production
- incremental rollout 10%
- incremental rollout 25%
- incremental rollout 50%
- incremental rollout 100%
- performance
- cleanup
before_script:
- make setup
ruff lint:
  stage: test
  cache:
    key:
      files:
      - requirements/requirements.txt
    paths:
    - "${CI_PROJECT_DIR}/.cache"
    policy: pull-push
  allow_failure: true
  script:
  - ". venv/bin/activate && ruff check vchat/ --output-format=gitlab > code-quality-report.json"
  artifacts:
    reports:
      codequality: "$CI_PROJECT_DIR/code-quality-report.json"
ruff format:
  stage: test
  cache:
    key:
      files:
      - requirements/requirements.txt
    paths:
    - "${CI_PROJECT_DIR}/.cache"
    policy: pull-push
  script:
  - ". venv/bin/activate && ruff format --diff vchat/"
bandit:
  stage: test
  cache:
    key:
      files:
      - requirements/requirements.txt
    paths:
    - "${CI_PROJECT_DIR}/.cache"
    policy: pull-push
  allow_failure: true
  script:
  - ". venv/bin/activate && bandit -r vchat/ --quiet"
".deploy_script": |
  ssh "deploy@cdn.okumy.com" <<EOF
    set -e
    PROJ_DIR="/var/www/vchat"
    echo "Deployment path: \$PROJ_DIR"
    cd "\$PROJ_DIR"
    if [ ! -d .git ]; then
      git clone git@venv.dev:vchat/pusk.git .
    else
      git reset --hard
      git pull origin master
    fi
    source ~/.profile
    ./bin/deploy.sh
  EOF
deploy:
  stage: deploy
  script: |
    ssh "deploy@cdn.okumy.com" <<EOF
      set -e
      PROJ_DIR="/var/www/vchat"
      echo "Deployment path: \$PROJ_DIR"
      cd "\$PROJ_DIR"
      if [ ! -d .git ]; then
        git clone git@venv.dev:vchat/pusk.git .
      else
        git reset --hard
        git pull origin master
      fi
      source ~/.profile
      ./bin/deploy.sh
    EOF
  rules:
  - if: $CI_COMMIT_BRANCH == "master"
    when: always
  - when: never
sast:
  stage: test
include:
- template: Auto-DevOps.gitlab-ci.yml
