.x-commit-cache: &commit_cache
  key:
    files:
      - "requirements/requirements.txt"
  paths:
    - "${CI_PROJECT_DIR}/.cache"
  policy: pull-push

stages:
  - test
  - deploy

ruff lint:
  stage: test
  cache:
    <<: *commit_cache
  before_script:
    - make setup
  allow_failure: true
  script:
    - . venv/bin/activate && ruff check vchat/ --output-format=gitlab > code-quality-report.json
  artifacts:
    reports:
      codequality: $CI_PROJECT_DIR/code-quality-report.json

ruff format:
  stage: test
  cache:
    <<: *commit_cache
  before_script:
    - make setup
  script:
    - . venv/bin/activate && ruff format --diff vchat/

# mypy:
#   stage: test
#   cache:
#     <<: *commit_cache
#   allow_failure: true
#   script:
#     - . venv/bin/activate && mypy --explicit-package-bases vchat/

bandit:
  stage: test
  cache:
    <<: *commit_cache
  before_script:
    - make setup
  allow_failure: true
  script:
    - . venv/bin/activate && bandit -r vchat/ --quiet

.deploy_script: &deploy_script |
  mkdir -p ~/.ssh
  chmod 700 ~/.ssh
  ssh-keyscan -H cdn.okumy.com >> ~/.ssh/known_hosts 2>/dev/null || true
  ssh "deploy@cdn.okumy.com" <<EOF
    set -e
    PROJ_DIR="/var/www/vchat"
    echo "Deployment path: \$PROJ_DIR"
    if [ ! -d "\$PROJ_DIR/.git" ]; then
      mkdir -p "\$PROJ_DIR"
      cd "\$PROJ_DIR"
      git clone git@venv.dev:vbudushee/vchat.git .
    else
      cd "\$PROJ_DIR"
      git fetch origin
      git reset --hard origin/master
    fi
    source ~/.profile
    ./bin/deploy.sh
  EOF

# Additional deploy_new job
deploy:
  stage: deploy
  before_script: []
  variables:
    GIT_STRATEGY: none
  script: *deploy_script
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
      when: always
    - when: never
