apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: vchat

resources:
  - servicemonitor.yaml
  - grafana-deployment.yaml
  - grafana-service.yaml

configMapGenerator:
  - name: vchat-grafana-datasources
    files:
      - prometheus.yaml=grafana/provisioning/datasources/prometheus.yaml
  - name: vchat-grafana-dashboard-providers
    files:
      - vchat.yaml=grafana/provisioning/dashboards/vchat.yaml
  - name: vchat-grafana-dashboards
    files:
      - vchat-grafana.json=grafana/dashboards/vchat-grafana.json

generatorOptions:
  disableNameSuffixHash: true
