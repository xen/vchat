apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: vchat
  labels:
    app.kubernetes.io/name: vchat
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: vchat
      app.kubernetes.io/component: metrics
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
