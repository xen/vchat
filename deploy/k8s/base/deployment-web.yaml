apiVersion: apps/v1
kind: Deployment
metadata:
  name: vchat-web
  labels:
    app.kubernetes.io/name: vchat
    app.kubernetes.io/component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: vchat
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vchat
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: vchat
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: vchat
          imagePullPolicy: IfNotPresent
          command: ["python"]
          args: ["entry.py", "--host", "0.0.0.0", "--port", "9080"]
          ports:
            - name: http
              containerPort: 9080
          envFrom:
            - secretRef:
                name: vchat-secret
          env:
            - name: PROMETHEUS_MULTIPROC_DIR
              value: /tmp
            - name: OMP_NUM_THREADS
              value: "2"
            - name: MKL_NUM_THREADS
              value: "2"
            - name: OPENBLAS_NUM_THREADS
              value: "2"
            - name: NUMEXPR_NUM_THREADS
              value: "2"
            - name: TOKENIZERS_PARALLELISM
              value: "false"
          volumeMounts:
            - name: config
              mountPath: /app/local.yaml
              subPath: local.yaml
              readOnly: true
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 3Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: vchat-config
        - name: tmp
          emptyDir: {}
