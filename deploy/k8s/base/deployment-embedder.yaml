apiVersion: apps/v1
kind: Deployment
metadata:
  name: vchat-embedder
  labels:
    app.kubernetes.io/name: vchat
    app.kubernetes.io/component: embedder
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vchat
      app.kubernetes.io/component: embedder
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vchat
        app.kubernetes.io/component: embedder
    spec:
      serviceAccountName: vchat
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: embedder
          image: vchat
          imagePullPolicy: IfNotPresent
          command: ["python"]
          args: ["-m", "jobs.embedder.launcher"]
          env:
            - name: EMBEDDER_INSTANCES
              value: "1"
            - name: PROMETHEUS_MULTIPROC_DIR
              value: /tmp
          envFrom:
            - secretRef:
                name: vchat-secret
          volumeMounts:
            - name: config
              mountPath: /app/local.yaml
              subPath: local.yaml
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 8Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: vchat-config
        - name: tmp
          emptyDir: {}
