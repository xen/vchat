apiVersion: apps/v1
kind: Deployment
metadata:
  name: vchat-web
spec:
  template:
    spec:
      containers:
        - name: web
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vchat-celery
spec:
  template:
    spec:
      containers:
        - name: celery
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vchat-celery-beat
spec:
  template:
    spec:
      containers:
        - name: celery-beat
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 512Mi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: vchat-migrate
spec:
  template:
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:18-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres.vchat.svc.cluster.local -p 5432 -U vchat; do
                sleep 1
              done
      containers:
        - name: migrate
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vchat-web
spec:
  minReplicas: 1
  maxReplicas: 1
