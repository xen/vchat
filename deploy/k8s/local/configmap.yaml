apiVersion: v1
kind: ConfigMap
metadata:
  name: vchat-config
data:
  local.yaml: |
    mode: stage
    public_url: "http://localhost:9080"
    allowed_origins:
      - "http://localhost:9080"
    cookie_domain: "localhost"
    cookie_secure: false
    enable_https_middleware: false

    redis_uri: "redis://redis.vchat.svc.cluster.local:6379/30"
    database_uri: !env "$DATABASE_URI"
    celery_redis_uri: "redis://redis.vchat.svc.cluster.local:6379/"
    celery_broker_db: 31
    celery_backend_db: 32
    celery_worker_concurrency: 1
    embedding_service_url: !env "$EMBEDDING_SERVICE_URL"

    log_format: "json"
    openai_api_key: !env "$OPENAI_API_KEY"
    gigachat_api_key: !env "$GIGACHAT_API_KEY"
    secret_key: !env "$SECRET_KEY"
    cookie_key: !env "$COOKIE_KEY"
