<!doctype html>
<html lang="en" class="group/html">
    <head>
        <title>Nexus (HTML - DaisyUI)</title>

        <load src="partials/head.html" />
    </head>

    <body>
        <!--  Start: Layout - Main -->

        <div class="size-full">
            <div class="flex">
                <load src="partials/sidebar.html" />

                <div class="flex h-screen min-w-0 grow flex-col overflow-auto">
                    <load src="partials/topbar.html" />

                    <!--  Start: Layout - Content -->

                    <div id="layout-content">
                        <div class="flex items-center justify-between">
                            <p class="text-lg font-medium">Create Customer</p>
                            <div class="breadcrumbs hidden p-0 text-sm sm:inline">
                                <ul>
                                    <li><a href="./dashboards-ecommerce.html">Nexus</a></li>
                                    <li class="">
                                        <a href="./apps-ecommerce-customers.html">Customers</a>
                                    </li>
                                    <li class="opacity-80">Create</li>
                                </ul>
                            </div>
                        </div>
                        <div class="mt-6">
                            <div class="grid grid-cols-1 gap-5 md:grid-cols-2">
                                <div class="card bg-base-100 shadow">
                                    <div class="card-body">
                                        <div class="card-title">Basic Information</div>
                                        <div
                                            class="fieldset mt-2 grid grid-cols-1 gap-4 lg:grid-cols-2">
                                            <div class="space-y-2">
                                                <label class="fieldset-label" for="name">
                                                    Name
                                                </label>
                                                <input
                                                    class="input w-full"
                                                    placeholder="Name"
                                                    id="name"
                                                    type="text" />
                                            </div>
                                            <div class="space-y-2">
                                                <label class="fieldset-label">Email</label>
                                                <input
                                                    class="input w-full"
                                                    placeholder="Email"
                                                    id="email"
                                                    type="email" />
                                            </div>
                                            <div class="space-y-2">
                                                <label class="fieldset-label">Mobile</label>
                                                <input
                                                    class="input w-full"
                                                    placeholder="(098) 765 4321"
                                                    type="tel" />
                                            </div>
                                            <div class="space-y-2">
                                                <label class="fieldset-label" for="DOB">DOB</label>
                                                <input
                                                    class="input w-full"
                                                    aria-label="DOB"
                                                    id="DOB"
                                                    type="date" />
                                            </div>
                                            <div class="flex items-center gap-3">
                                                <input
                                                    class="toggle toggle-sm"
                                                    id="verified"
                                                    type="checkbox" />
                                                <label class="label" for="verified">Verified</label>
                                            </div>
                                            <div class="flex items-center gap-3">
                                                <input
                                                    class="radio radio-sm"
                                                    id="apps-seller-gender-male"
                                                    type="radio"
                                                    value="male"
                                                    checked=""
                                                    name="apps-seller-gender" />
                                                <label
                                                    class="fieldset-label"
                                                    for="apps-seller-gender-male">
                                                    Male
                                                </label>
                                                <input
                                                    class="radio radio-sm"
                                                    id="apps-seller-gender-female"
                                                    type="radio"
                                                    value="female"
                                                    checked=""
                                                    name="apps-seller-gender" />
                                                <label
                                                    class="fieldset-label"
                                                    for="apps-seller-gender-female">
                                                    Female
                                                </label>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="card bg-base-100 shadow">
                                    <div class="card-body">
                                        <div class="card-title">Address</div>
                                        <div
                                            class="fieldset mt-2 grid grid-cols-1 gap-4 lg:grid-cols-2">
                                            <div class="space-y-2">
                                                <label class="fieldset-label" for="street-address">
                                                    Street Address
                                                </label>
                                                <input
                                                    class="input w-full"
                                                    id="street-address"
                                                    placeholder="Street Address"
                                                    type="text" />
                                            </div>
                                            <div class="space-y-2">
                                                <label class="fieldset-label" for="city">
                                                    City
                                                </label>
                                                <input
                                                    class="input w-full"
                                                    id="city"
                                                    placeholder="City"
                                                    type="text" />
                                            </div>
                                            <div class="space-y-2">
                                                <label class="fieldset-label" for="state">
                                                    State
                                                </label>
                                                <input
                                                    class="input w-full"
                                                    id="state"
                                                    placeholder="State"
                                                    type="text" />
                                            </div>
                                            <div class="space-y-2">
                                                <label class="fieldset-label" for="postal-code">
                                                    Postal Code
                                                </label>
                                                <input
                                                    class="input w-full"
                                                    id="postal-code"
                                                    placeholder="564-879"
                                                    type="text" />
                                            </div>
                                            <div class="flex items-center gap-3">
                                                <input
                                                    class="checkbox checkbox-sm"
                                                    id="set-as-permanent"
                                                    type="checkbox" />
                                                <label class="label" for="set-as-permanent">
                                                    Set as permanent
                                                </label>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="card bg-base-100 shadow">
                                    <div class="card-body">
                                        <div class="card-title">Image</div>
                                        <p class="mt-4 text-sm text-base-content/60">
                                            File uploads are not available.
                                        </p>
                                    </div>
                                </div>
                                <div class="bg-base-100 card h-fit shadow">
                                    <div class="card-body gap-0">
                                        <div class="card-title">Create Password</div>
                                        <div
                                            class="fieldset mt-2 grid grid-cols-1 gap-x-4 lg:grid-cols-2">
                                            <div class="space-y-2" x-data="{ show: false }">
                                                <label class="fieldset-label" for="password">
                                                    Password
                                                </label>
                                                <label class="input w-full focus:outline-0">
                                                    <iconify-icon icon="lucide:key-round" class="text-base-content/60 size-4"></iconify-icon>
                                                    <input
                                                        class="grow focus:outline-0"
                                                        placeholder="Password"
                                                        id="password"
                                                        type="password"
                                                        :type="show ? 'text' : 'password'" />
                                                    <label
                                                        class="swap btn btn-xs btn-ghost btn-circle text-base-content/60">
                                                        <input
                                                            type="checkbox"
                                                            x-model="show"
                                                            aria-label="Show password"
                                                            data-password="password" />
                                                        <iconify-icon icon="lucide:eye" class="swap-off size-4"></iconify-icon>
                                                        <iconify-icon icon="lucide:eye-off" class="swap-on size-4"></iconify-icon>
                                                    </label>
                                                </label>
                                            </div>
                                            <div class="space-y-2" x-data="{ show: false }">
                                                <label
                                                    class="fieldset-label"
                                                    for="confirm-password">
                                                    Confirm Password
                                                </label>
                                                <label class="input w-full focus:outline-0">
                                                    <iconify-icon icon="lucide:key-round" class="text-base-content/60 size-4"></iconify-icon>
                                                    <input
                                                        class="grow focus:outline-0"
                                                        id="confirm-password"
                                                        placeholder="Confirm Password"
                                                        type="password"
                                                        :type="show ? 'text' : 'password'" />
                                                    <label
                                                        class="swap btn btn-xs btn-ghost btn-circle text-base-content/60">
                                                        <input
                                                            type="checkbox"
                                                            x-model="show"
                                                            aria-label="Show password"
                                                            data-password="confirm-password" />
                                                        <iconify-icon icon="lucide:eye" class="swap-off size-4"></iconify-icon>
                                                        <iconify-icon icon="lucide:eye-off" class="swap-on size-4"></iconify-icon>
                                                    </label>
                                                </label>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="mt-6 flex justify-end gap-3">
                                <a
                                    class="btn btn-sm btn-ghost"
                                    href="./apps-ecommerce-customers.html">
                                    <iconify-icon icon="lucide:x" class="size-4"></iconify-icon>
                                    Cancel
                                </a>
                                <a
                                    class="btn btn-sm btn-primary"
                                    href="./apps-ecommerce-customers.html">
                                    <iconify-icon icon="lucide:check" class="size-4"></iconify-icon>
                                    Save
                                </a>
                            </div>
                        </div>
                    </div>

                    <!--  End: Layout - Content -->
                    <load src="partials/footer.html" />
                </div>
            </div>

            <load src="partials/rightbar.html" />
        </div>

        <!--  End: Layout - Main -->

        <load src="partials/footer-scripts.html" />
    </body>
</html>
