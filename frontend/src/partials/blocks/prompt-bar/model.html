<div class="card bg-primary/10 max-w-2xl grow">
    <div class="flex items-center gap-2 px-4 py-1.5">
        <iconify-icon icon="lucide:info" class="text-primary size-3.5"></iconify-icon>
        <p class="text-primary grow text-xs">
            This tool lets you choose and prompt different models.
        </p>
        <button
            class="btn btn-xs btn-circle btn-ghost hover:bg-primary/20 border-0"
            aria-label="Close">
            <iconify-icon icon="lucide:x" class="text-primary/60 size-4"></iconify-icon>
        </button>
    </div>
    <div class="card-body bg-base-100 rounded-box border-primary/15 border border-t-0 p-3">
        <textarea
            class="textarea m-0 h-28 w-full resize-none border-0 p-1 text-base focus:outline-none"
            placeholder="Type your request and select a model to process it"
            spellcheck="false"
            aria-label="To enrich screen reader interactions, please activate Accessibility in Grammarly extension settings"></textarea>
        <div class="mt-2 flex items-end justify-between">
            <div class="flex items-center">
                <div class="dropdown dropdown-start">
                    <div
                        tabindex="0"
                        role="button"
                        class="btn btn-sm btn-ghost gap-2"
                        aria-label="Model Selector">
                        <iconify-icon icon="lucide:cpu" class="size-4"></iconify-icon>
                        <p>ChatGPT</p>
                        <iconify-icon icon="lucide:chevron-down" class="size-3.5"></iconify-icon>
                    </div>
                    <ul
                        tabindex="0"
                        class="dropdown-content bg-base-100 rounded-box menu mt-2 w-48 p-1.5 shadow">
                        <li><div>ChatGPT</div></li>
                        <li><div>Midjourney</div></li>
                        <li><div>Claude</div></li>
                        <li><div>Gemini</div></li>
                        <li><div>Stable Diffusion</div></li>
                        <li><div>Perplexity</div></li>
                        <li><div>Copilot</div></li>
                    </ul>
                </div>
            </div>
            <div class="flex items-center gap-1">
                <button class="btn btn-sm btn-square btn-ghost" aria-label="Add Action">
                    <iconify-icon icon="lucide:plus" class="text-base-content/60 size-4"></iconify-icon>
                </button>
                <button class="btn btn-sm btn-square btn-ghost" aria-label="Voice Input">
                    <iconify-icon icon="lucide:mic" class="text-base-content/60 size-4"></iconify-icon>
                </button>
                <button class="btn btn-primary btn-sm gap-2" aria-label="Send Prompt">
                    <iconify-icon icon="lucide:send" class="size-3.5"></iconify-icon>
                    Send
                </button>
            </div>
        </div>
    </div>
</div>
