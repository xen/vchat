<div class="card bg-base-100 card-border max-w-2xl grow">
    <div class="card-body p-3">
        <textarea
            aria-label="Textarea"
            class="textarea m-0 h-28 w-full resize-none border-0 p-1 text-base focus:outline-none"
            placeholder="Describe what you want to create or edit"></textarea>
        <div class="mt-2 flex items-end justify-between">
            <div class="flex items-center gap-0.5">
                <button class="btn btn-sm btn-square btn-ghost" aria-label="Add Action">
                    <iconify-icon icon="lucide:plus" class="text-base-content/60 size-4"></iconify-icon>
                </button>
                <button class="btn btn-sm btn-square btn-ghost" aria-label="Insert Image">
                    <iconify-icon icon="lucide:image-plus" class="text-base-content/60 size-4"></iconify-icon>
                </button>
            </div>
            <span class="text-xs">
                <span class="text-base-content/80">Tokens:</span>
                <span class="text-error font-medium">88</span>
                <span class="text-base-content/60">/100</span>
            </span>
            <div class="flex items-center gap-1">
                <button class="btn btn-sm btn-square btn-ghost" aria-label="Voice Input">
                    <iconify-icon icon="lucide:mic" class="text-base-content/60 size-4"></iconify-icon>
                </button>
                <button class="btn btn-primary btn-square btn-sm" aria-label="Send">
                    <iconify-icon icon="lucide:arrow-up" class="size-4"></iconify-icon>
                </button>
            </div>
        </div>
    </div>
</div>
