<div class="card bg-base-200/50 card-border max-w-2xl grow">
    <div class="card-body bg-base-100 rounded-box p-3">
        <textarea
            aria-label="Textarea"
            class="textarea m-0 h-20 w-full resize-none border-0 p-1 text-base focus:outline-none"
            placeholder="Write your prompt or select one from My Prompts"></textarea>
        <div class="mt-2 flex items-end justify-between">
            <div class="flex items-center gap-0.5">
                <button class="btn btn-sm btn-square btn-ghost" aria-label="Quick Action">
                    <iconify-icon icon="lucide:volume-2" class="text-base-content/60 size-4"></iconify-icon>
                </button>
                <button class="btn btn-sm btn-square btn-ghost" aria-label="Quick Action">
                    <iconify-icon icon="lucide:smile-plus" class="text-base-content/60 size-4"></iconify-icon>
                </button>
            </div>
            <div class="flex items-center gap-1">
                <button class="btn btn-sm btn-square btn-ghost" aria-label="Voice Input">
                    <iconify-icon icon="lucide:mic" class="text-base-content/60 size-4"></iconify-icon>
                </button>
                <button class="btn btn-primary btn-square btn-sm" aria-label="Send Prompt">
                    <iconify-icon icon="lucide:arrow-up" class="size-4"></iconify-icon>
                </button>
            </div>
        </div>
    </div>
    <div class="flex items-center justify-between gap-1 px-2 py-1.5">
        <button class="btn btn-sm btn-ghost text-base-content/80" aria-label="My Prompts">
            <iconify-icon icon="lucide:book-text" class="size-4"></iconify-icon>
            My Prompts
            <iconify-icon icon="lucide:chevron-down" class="text-base-content/60 size-3.5"></iconify-icon>
        </button>
        <div class="flex items-center gap-0.5">
            <button class="btn btn-sm btn-square btn-ghost" aria-label="Quick Action">
                <iconify-icon icon="lucide:pin" class="text-base-content/60 size-4"></iconify-icon>
            </button>
            <button class="btn btn-sm btn-square btn-ghost" aria-label="Settings">
                <iconify-icon icon="lucide:save" class="text-base-content/60 size-4"></iconify-icon>
            </button>
            <button class="btn btn-sm btn-square btn-ghost" aria-label="Settings">
                <iconify-icon icon="lucide:settings-2" class="text-base-content/60 size-4"></iconify-icon>
            </button>
        </div>
    </div>
</div>
