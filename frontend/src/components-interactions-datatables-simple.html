<!doctype html>
<html lang="en" class="group/html">
    <head>
        <title>Nexus (HTML - DaisyUI)</title>

        <load src="partials/head.html" />
    </head>

    <body>
        <!--  Start: Layout - Main -->

        <div id="components-layout">
            <div id="components-layout-container">

                <div id="components-layout-main">

                    <div id="components-layout-content">
                        <div class="flex flex-col items-center justify-center space-y-0.5">
                            <div
                                class="text-base-content/80 border-base-300 flex items-center gap-1.5 rounded-full border px-2.5 py-1 text-xs leading-none tracking-[0.2px]">
                                <div class="status status-sm bg-base-content/30"></div>
                                Interactions
                            </div>
                            <p
                                class="from-base-content to-base-content/75 bg-linear-to-b bg-clip-text pb-1 text-3xl font-bold tracking-tight text-transparent lg:text-4xl 2xl:text-5xl">

                            </p>
                            <p class="text-base-content/80 max-w-lg text-center max-md:text-sm">
                                Powerful data tables with sorting, search, pagination, column

                        <div class="bg-base-200/40 rounded-box mt-6 px-5 py-4 lg:mt-12">

                            <p class="mt-1">
                                <span class="me-1">- Plugin Documentation:</span>
                                <a
                                    target="_blank"
                                    class="text-primary"
                                    href="https://tanstack.com/table">
                                    Tanstack Table
                                </a>
                            </p>
                        </div>

                        <p class="text-base-content/60 mt-8 font-medium">Complete Actions</p>
                        <div class="mt-4 lg:mt-6">
                            <div class="bg-base-100 card card-border">
                                <div
                                    class="bg-base-200/30 rounded-t-box flex flex-wrap items-center justify-between space-x-2 px-5 py-4">
                                    <p class="font-medium">Recent Orders</p>
                                    <p class="text-base-content/50 text-xs italic">
                                        Synced 20 min ago
                                    </p>
                                </div>
                                <load src="partials/interactions/datatables/advanced.html" />
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!--  End: Layout - Main -->


        <!--  CDN for Datatables -->
        <script src="https://unpkg.com/@tanstack/table-core@8.11.6/build/umd/index.development.js"></script>
        <script src="/js/components/datatables.js"></script>

</html>
