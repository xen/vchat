[build-system]
requires = ["setuptools>=67.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vchat"
version = "0.1.0"
description = "Backend services and workers for the vchat platform."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "vchat Team" }]
urls = { Homepage = "https://www.vchat.com" }

[tool.setuptools.packages.find]
include = ["vchat*", "jobs*"]

[tool.ruff.lint]
ignore = ["E712", "E402"]
